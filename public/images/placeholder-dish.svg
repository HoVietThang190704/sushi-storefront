<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="50%" stop-color="#f1f3f5" />
      <stop offset="100%" stop-color="#e9ecef" />
    </linearGradient>
    <radialGradient id="circleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c92a2a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#c92a2a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Japanese Sun accent ring -->
  <circle cx="400" cy="210" r="130" fill="url(#circleGrad)" />
  <circle cx="400" cy="210" r="80" fill="none" stroke="#c92a2a" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4" />

  <!-- Center Icon: Stylized Nigiri Dish -->
  <g transform="translate(400, 200) scale(1.5)" text-anchor="middle">
    <!-- Plate / Tray -->
    <path d="M-36 12 C-20 22, 20 22, 36 12 C28 26, -28 26, -36 12 Z" fill="#ced4da" opacity="0.8" />
    <!-- Nigiri rice -->
    <rect x="-16" y="-4" width="32" height="14" rx="7" fill="#ffffff" stroke="#ced4da" stroke-width="1.5" />
    <!-- Salmon topping -->
    <path d="M-22 -8 C-10 -15, 10 -15, 22 -8 C20 4, -20 4, -22 -8 Z" fill="#e03131" opacity="0.9" />
    <!-- White salmon stripes -->
    <path d="M-12 -12 L-4 -2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M2 -12 L10 -2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <!-- Chopsticks -->
    <line x1="-38" y1="-26" x2="38" y2="26" stroke="#868e96" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="-30" y1="-30" x2="42" y2="20" stroke="#adb5bd" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Text Info -->
  <text x="400" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#495057" letter-spacing="3" text-anchor="middle">HANBI SUSHI</text>
  <text x="400" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#868e96" letter-spacing="1" text-anchor="middle">Hình ảnh đang cập nhật</text>
</svg>
